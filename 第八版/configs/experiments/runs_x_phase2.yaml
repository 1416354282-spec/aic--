project:
  seed: 42
  deterministic: true
  output_root: /root/aic/v6/第六版/outputs/runs
data:
  train_root: /root/autodl-tmp/训练集
  test_root: D:/AIC面对城市场景的视觉多模态目标检测/AIC2026_PHASE_2_1000
  split_dir: /root/aic/v6/第二版-outputs/splits
  fold: 0
  infrared_mode: mean
  depth_encoding: hha
  depth_mode: log
  include_originals: true
  augment_ratio: 1.0
model:
  mode: tri
  weights: D:/AIC面对城市场景的视觉多模态目标检测/rtdetr-x.pt
  yaml_cfg: rtdetr-x.yaml
  num_classes: 12
  fusion: tri_cssa
  feature_layers:
  - 4
  - 10
  - 13
  backbone_end: 13
  probe_size: 256
  out_strides:
  - 8
  - 16
  - 32
  ir_width: 0.375
  depth_width: 0.375
  attention_groups: 8
  cmtf_nhead: 2
  cmtf_cross_attn: true
  cmtf_lite: false
  target_refinement_levels:
  - 0
  - 1
augmentation:
  horizontal_flip: 0.5
  scale: 0.2
  translate: 0.1
  affine_probability: 0.33
  infrared_dropout: 0.1
  depth_dropout: 0.1
  dark_brightness: 0.35
train:
  workers: 2
  validate_every: 5
  save_every: 10
  ema:
    enabled: true
    decay: 0.9999
  phases:
  - epochs: 20
    lr: 0.001
    size:
    - 640
    - 640
    batch_size: 16
    freeze_backbone: true
    freeze_decoder: true
    rgb_lr_ratio: 0.1
    detector_lr_ratio: 0.5
    accumulation_steps: 2
    warmup_epochs: 3
    final_lr_ratio: 0.01
  - epochs: 85
    lr: 0.0005
    size:
    - 1024
    - 576
    batch_size: 12
    freeze_backbone: true
    freeze_decoder: false
    rgb_lr_ratio: 0.1
    detector_lr_ratio: 0.5
    accumulation_steps: 2
    warmup_epochs: 3
    final_lr_ratio: 0.01
  - epochs: 45
    lr: 0.0001
    size:
    - 1536
    - 864
    batch_size: 3
    freeze_backbone: false
    freeze_decoder: false
    rgb_lr_ratio: 0.1
    detector_lr_ratio: 0.5
    accumulation_steps: 6
    warmup_epochs: 2
    final_lr_ratio: 0.01
loss:
  target_mask:
    enabled: true
    weight: 0.1
    focal_gamma: 2.0
    dice_weight: 1.0
    center_sigma: 0.35
  dssm:
    enabled: false
    implementation: proxy
validation:
  confidence: 0.001
  class_confidence: {}
  nms_iou: 0.7
  max_detections: 100
  multi_label: true
