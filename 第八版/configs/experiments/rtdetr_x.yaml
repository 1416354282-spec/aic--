# E8: RT-DETR-X 底座消融 (65M 参数, COCO 54.8 AP)
# X 显存约为 L 的 1.3~1.5x, batch 整体下调一档 + 累积补偿 (有效 batch 不变)
model:
  yaml_cfg: rtdetr-x.yaml   # 权重由 --set model.weights=... 指定 (远程绝对路径)
  feature_layers: [4, 10, 13]  # RT-DETR-X: S3/S4/S5 在层 4/10/13 (与 L 的 3/7/9 不同)
  backbone_end: 13
train:
  phases:
    - epochs: 30            # Phase 1: 新分支 + 分类头 (1024x576 高分辨率成形)
      lr: 0.001
      size: [1024, 576]
      batch_size: 12   # torch2.8 实测 16 OOM → 12 安全 (23.5G)
      freeze_backbone: true
      freeze_decoder: true
      rgb_lr_ratio: 0.1
      detector_lr_ratio: 0.5
      accumulation_steps: 2
      warmup_epochs: 3
      final_lr_ratio: 0.01
    - epochs: 60            # Phase 2: 解冻 neck+decoder, 原图分辨率
      lr: 0.0005
      size: [1920, 1088]
      batch_size: 2   # 1920x1088 峰值实测: batch4=31.3G OOM, batch3=30.7G 临界 → 2 安全 (有效 batch 靠累积)
      freeze_backbone: true
      freeze_decoder: false
      rgb_lr_ratio: 0.1
      detector_lr_ratio: 0.5
      accumulation_steps: 8
      warmup_epochs: 3
      final_lr_ratio: 0.01
    - epochs: 45            # Phase 3: 全解冻, 原图分辨率精调
      lr: 0.0001
      size: [1920, 1088]    # 原图 1920x1080 (1088=34x32 满足整除约束)
      batch_size: 2
      freeze_backbone: false
      freeze_decoder: false
      rgb_lr_ratio: 0.1
      detector_lr_ratio: 0.5
      accumulation_steps: 8
      warmup_epochs: 2
      final_lr_ratio: 0.01
